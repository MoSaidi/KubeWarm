name: Commitizen Push Check

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check-commit:
    name: Check pushed commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check commit message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: uvx --from commitizen==4.19.2 cz check --message "$COMMIT_MESSAGE"