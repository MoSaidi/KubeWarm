apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubewarm-webhook
  namespace: kubewarm
  labels:
    app.kubernetes.io/name: kubewarm
    app.kubernetes.io/component: controller
spec:
  ingressClassName: nginx
  rules:
    - host: kubewarm.example.com
      http:
        paths:
          - path: /webhook/preheat
            pathType: Exact
            backend:
              service:
                name: kubewarm-controller
                port:
                  number: 8080
